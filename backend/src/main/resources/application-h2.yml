server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: online-compiler
    
  datasource:
    url: jdbc:h2:mem:online_compiler
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  security:
    user:
      name: admin
      password: admin123

# JWT Configuration
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours in milliseconds

# Code Execution Configuration
code-executor:
  timeout: 10 # seconds
  max-memory: 256m
  max-output-size: 10000 # characters
  temp-dir: ./temp
  
# CORS Configuration
cors:
  allowed-origins: http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    root: INFO
    com.compiler: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
